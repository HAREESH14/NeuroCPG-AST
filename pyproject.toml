[project]
name = "neuroast"
version = "0.1.0"
description = "NeuroAST: A Neuro-Symbolic Framework for Measuring and Mitigating Structural Hallucinations in LLM-Based Cross-Language Code Translation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Symbolic — Phase 1 (tree-sitter)
    "tree-sitter>=0.24",
    "tree-sitter-c>=0.23",
    "tree-sitter-java>=0.23",
    # Symbolic — Phase 2 (Joern CPG)
    "networkx>=3.3",
    "cpgqls-client",
    # Similarity metrics (Phase 1 tree edit distance)
    "zss>=1.2",
    # Neural (LLM routing)
    "litellm>=1.60",
    # Data models & config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # CLI
    "typer>=0.15",
    "rich>=13.9",
    "pandas>=3.0.3",
    "tabulate>=0.10.0",
]

[project.scripts]
neuroast = "neuroast.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
